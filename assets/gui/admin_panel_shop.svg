<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <!-- Admin Panel Shop GUI background -->
  <rect x="0" y="0" width="128" height="64" fill="#2a0a0a"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="128" height="14" fill="#4a1010"/>
  <text x="64" y="11" font-family="Arial, sans-serif" font-size="11" fill="#ff5555" text-anchor="middle" font-weight="bold">ADMIN PANEL SHOP</text>
  <!-- Decorative line -->
  <rect x="8" y="16" width="112" height="2" fill="#ff5555" opacity="0.6"/>
  <!-- Cost display -->
  <text x="64" y="26" font-family="Arial, sans-serif" font-size="7" fill="#ffd700" text-anchor="middle">COST: 200 COINS</text>
  <!-- Slot outline -->
  <rect x="54" y="32" width="20" height="20" fill="#3a1a1a" stroke="#ff5555" stroke-width="1"/>
  <!-- Command block icon -->
  <rect x="59" y="35" width="10" height="10" fill="#b0b0b0"/>
  <rect x="60" y="36" width="4" height="4" fill="#909090"/>
  <rect x="66" y="36" width="4" height="4" fill="#c8c8c8"/>
  <rect x="60" y="42" width="4" height="4" fill="#c8c8c8"/>
  <rect x="66" y="42" width="4" height="4" fill="#909090"/>
  <!-- Red highlight -->
  <rect x="60" y="36" width="4" height="1" fill="#ff5555"/>
  <rect x="66" y="36" width="1" height="4" fill="#ff5555"/>
  <text x="64" y="58" font-family="Arial, sans-serif" font-size="6" fill="#ff8888" text-anchor="middle">UNLOCK POWERFUL TOOLS</text>
</svg>
